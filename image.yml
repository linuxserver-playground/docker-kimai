# The manifest for docker-kimai. Schema: https://github.com/linuxserver-playground/builder/blob/main/schemas/image.schema.json
schema: 1
name: kimai

summary: |-
  [Kimai](https://kimai.org/) is a professional grade time-tracking application, free and open-source.
  It handles use-cases of freelancers as well as companies with dozens or hundreds of users.
  Kimai was build to track your project times and ships with many advanced features, including but not limited to:

  JSON API, invoicing, data exports, multi-timer and punch-in punch-out mode, tagging, multi-user - multi-timezones - multi-language ([over 30 translations existing](https://hosted.weblate.org/projects/kimai/)!), authentication via SAML/LDAP/Database, two-factor authentication (2FA) with TOTP, customizable role and team permissions, responsive design, user/customer/project specific rates, advanced search & filtering, money and time budgets, advanced reporting, support for [plugins](https://www.kimai.org/store/) and so much more.

upstream:
  url: https://kimai.org/
  version:
    type: github_release
    repo: kimai/kimai
  notes:
    type: github_release
    repo: kimai/kimai
  sponsor:
  - name: Kimai
    url: https://www.kimai.org/donate/

release:
  branch: main
  tag: latest
  channel: stable

build:
  base: alpine-nginx
  version_arg: KIMAI_RELEASE
  platforms:
  - amd64
  - arm64

test:
  enabled: false
  startup_timeout: 120

runtime:
  ports:
  - internal: '80'
    description: http gui
  - internal: '443'
    description: https gui
  volumes:
  - path: /config
    host_path: /path/to/kimai/config
    description: Persistent config files
  env:
  - name: APP_SECRET
    value: ''
    description: Random string used for session encryption. Generate using e.g. `openssl rand -hex 32`.
  - name: DATABASE_URL
    value: mysql://your_db_user:your_db_pass@your_db_host:3306/your_db_name?charset=your_db_charset&serverVersion=your_db_version
    description: Configure your database connection, see Application Setup instructions.
  - name: TRUSTED_HOSTS
    value: kimai.example.com
    description: |-
      Domain or IP you will be using to access Kimai. Can be a regex like `localhost|127.0.0.1|kimai.example.com`
  - name: TRUSTED_PROXIES
    value: 127.0.0.1/32
    description: If behind a reverse proxy set this to its IP or network CIDR so that Kimai trusts its headers.
    optional: true

docs:
  categories:
  - Finance
  - Business
  logo: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/kimai-logo.png
  setup: |
    ### Configure your database connection

    You have to replace the following values with your defaults:

    * the database username "your_db_user"
    * the database password "your_db_pass"
    * the database schema name "your_db_name"
    * the database host or IP "your_db_host"
    * the database character set "your_db_charset" (usually "utf8")
    * the database version "your_db_version"
      * run `SELECT VERSION();` in your MariaDB/MySQL database to get the version
      * example for [MariaDB](https://www.doctrine-project.org/projects/doctrine-dbal/en/current/reference/configuration.html#mariadb) use "10.11.4-MariaDB-log"
      * example for [MySQL](https://www.doctrine-project.org/projects/doctrine-dbal/en/current/reference/configuration.html#mysql) use "8.0.32"
    * you might have to adapt port "3306" as well

    ```env
    DATABASE_URL=mysql://your_db_user:your_db_pass@your_db_host:3306/your_db_name?charset=your_db_charset&serverVersion=your_db_version
    ````

    ### Create your first user

    ```shell
    docker exec -it kimai console kimai:user:create your_username admin@example.com ROLE_SUPER_ADMIN
    ```

    ### Initial setup

    Access the web gui at `http://<your-ip>:80`, for more information check out [Kimai Initial setup](https://www.kimai.org/documentation/initial-setup.html).
  external_application:
    cli: |
      docker run -d \
        --name=mariadb \
        -e PUID=1000 \
        -e PGID=1000 \
        -e TZ=Etc/UTC \
        -e MYSQL_ROOT_PASSWORD=ROOT_ACCESS_PASSWORD \
        -e MYSQL_DATABASE=your_db_name `#optional` \
        -e MYSQL_USER=your_db_user `#optional` \
        -e MYSQL_PASSWORD=your_db_pass `#optional` \
        -p 3306:3306 \
        -v path_to_data:/config \
        --restart unless-stopped \
        lscr.io/linuxserver/mariadb:latest
    compose: |
      # MariaDB
        mariadb:
          image: lscr.io/linuxserver/mariadb:latest
          container_name: mariadb
          environment:
            - PUID=1000
            - PGID=1000
            - TZ=Etc/UTC
            - MYSQL_ROOT_PASSWORD=ROOT_ACCESS_PASSWORD
            - MYSQL_DATABASE=your_db_name #optional
            - MYSQL_USER=your_db_user #optional
            - MYSQL_PASSWORD=your_db_pass #optional
          volumes:
            - path_to_data:/config
          ports:
            - 3306:3306
          restart: unless-stopped
    unraid: |-
      We recommend using our [MariaDB](https://github.com/linuxserver/docker-mariadb) container from community applications.

publish:
  unraid:
    requirement: A MySQL or MariaDB database is required.

proxy:
  port: 80
  subdomain: true
  subfolder:
    supported: false
  api_locations:
  - /api

changelog:
- date: '2027-07-04'
  text: Rebase to Alpine 3.24.
- date: '2025-12-28'
  text: Rebase to Alpine 3.23.
- date: '2025-07-04'
  text: Rebase to Alpine 3.22.
- date: '2025-04-06'
  text: Rebase to Alpine 3.21.
- date: '2024-06-30'
  text: |-
    Rebase to Alpine 3.20. Existing users should update their nginx confs to avoid http2 deprecation warnings.
- date: '2024-03-24'
  text: Added LDAP module to composer
- date: '2024-03-06'
  text: 'Existing users should update: site-confs/default.conf - Cleanup default site conf.'
- date: '2024-01-23'
